<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Bilai Pet Clinic - ERP</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase App & Database Compat (Bulletproof CDN) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body class="bg-stone-100 text-stone-900 p-4 md:p-8">

    <!-- Header Status -->
    <div class="max-w-7xl mx-auto mb-6 bg-white p-4 rounded-xl shadow-sm flex flex-col md:flex-row justify-between items-center border-l-4 border-emerald-800">
        <div class="flex items-center gap-3">
            <div class="text-2xl">🐾</div>
            <div>
                <h1 class="text-2xl font-bold text-emerald-950">Mr. Bilai Pet Clinic</h1>
                <p class="text-sm text-gray-500">Live Client ERP Dashboard</p>
            </div>
        </div>
        <div id="db-status" class="mt-3 md:mt-0 px-4 py-1.5 rounded-full text-xs font-semibold bg-amber-100 text-amber-800">
            Connecting Core System...
        </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="max-w-7xl mx-auto mb-6 flex gap-2 border-b border-gray-200 pb-2">
        <button onclick="switchTab('inventory')" id="tab-inventory" class="px-4 py-2 bg-emerald-800 text-white rounded-lg font-medium tab-btn">Inventory</button>
        <button onclick="switchTab('sales')" id="tab-sales" class="px-4 py-2 text-gray-600 rounded-lg font-medium tab-btn hover:bg-gray-200">Counter Sales</button>
        <button onclick="switchTab('patients')" id="tab-patients" class="px-4 py-2 text-gray-600 rounded-lg font-medium tab-btn hover:bg-gray-200">Patient Visits</button>
    </div>

    <!-- Main Dynamic Layout -->
    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Left: Forms -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 h-fit">
            <!-- Inventory -->
            <div id="form-inventory" class="tab-content">
                <h3 class="text-lg font-bold mb-4 text-emerald-900">Add Stock Item</h3>
                <form id="invForm" onsubmit="handleInventorySubmit(event)" class="space-y-4">
                    <input type="text" id="inv-name" required placeholder="Item Name (e.g. Vaccine)" class="w-full p-2.5 border rounded-lg">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="inv-buy" step="0.01" required placeholder="Buy Price" class="w-full p-2.5 border rounded-lg">
                        <input type="number" id="inv-qty" required placeholder="Qty" class="w-full p-2.5 border rounded-lg">
                    </div>
                    <button type="submit" class="w-full bg-emerald-800 text-white p-2.5 rounded-lg font-medium">Save Item</button>
                </form>
            </div>

            <!-- Sales -->
            <div id="form-sales" class="tab-content hidden">
                <h3 class="text-lg font-bold mb-4 text-emerald-900">New Sale Invoice</h3>
                <form id="saleForm" onsubmit="handleSaleSubmit(event)" class="space-y-4">
                    <input type="text" id="sale-customer" required placeholder="Customer Name" class="w-full p-2.5 border rounded-lg">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="sale-total" required placeholder="Total Bill (Tk)" class="w-full p-2.5 border rounded-lg">
                        <select id="sale-method" class="w-full p-2.5 border rounded-lg">
                            <option value="Cash">Cash</option>
                            <option value="bKash">bKash</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-emerald-800 text-white p-2.5 rounded-lg font-medium">Process Sale</button>
                </form>
            </div>

            <!-- Patients -->
            <div id="form-patients" class="tab-content hidden">
                <h3 class="text-lg font-bold mb-4 text-emerald-900">Patient Registration</h3>
                <form id="patientForm" onsubmit="handlePatientSubmit(event)" class="space-y-4">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="p-name" required placeholder="Pet Name" class="w-full p-2.5 border rounded-lg">
                        <input type="text" id="p-type" required placeholder="Type (e.g. Dog)" class="w-full p-2.5 border rounded-lg">
                    </div>
                    <textarea id="p-symptoms" required placeholder="Symptoms" class="w-full p-2.5 border rounded-lg"></textarea>
                    <button type="submit" class="w-full bg-emerald-800 text-white p-2.5 rounded-lg font-medium">Check-in Patient</button>
                </form>
            </div>
        </div>

        <!-- Right: Dynamic Sync Database Table -->
        <div class="lg:col-span-2">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <h3 id="table-title" class="text-lg font-bold mb-4 text-stone-800">Live Inventory Items</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-gray-50 text-gray-500 text-xs uppercase" id="table-headers">
                            <tr><th class="p-3">Item Name</th><th class="p-3">Buy Price</th><th class="p-3">Qty</th><th class="p-3">Action</th></tr>
                        </thead>
                        <tbody id="data-rows" class="divide-y divide-gray-100">
                            <tr><td colspan="4" class="p-4 text-center text-gray-400">Loading Cloud Data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- Core Runtime Execution Scripts -->
    <script>
        // Exact credentials matching your screenshots configuration database profile
        const firebaseConfig = {
            apiKey: "AIzaSyAEsmdGyKJv4Lx4F2aUKCGSMZ2MaBgVoQY",
            authDomain: "mr-bilai-pet-clinic.firebaseapp.com",
            projectId: "mr-bilai-pet-clinic",
            storageBucket: "mr-bilai-pet-clinic.appspot.com", 
            databaseURL: "https://mr-bilai-pet-clinic-default-rtdb.firebaseio.com/",
            messagingSenderId: "761164198761",
            appId: "1:761164198761:web:cfa8202c4448bfb18b83f8"
        };

        // Try catch block to completely bypass blank freeze screen bugs
        try {
            firebase.initializeApp(firebaseConfig);
            var db = firebase.database();
            document.getElementById("db-status").innerText = "Cloud Online 🟢";
            document.getElementById("db-status").className = "mt-3 md:mt-0 px-4 py-1.5 rounded-full text-xs font-semibold bg-green-100 text-green-800";
        } catch(err) {
            console.error(err);
            document.getElementById("db-status").innerText = "Config Connection Error 🔴";
        }

        let activeTab = 'inventory';

        function switchTab(t) {
            activeTab = t;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.className = "px-4 py-2 text-gray-600 rounded-lg font-medium tab-btn hover:bg-gray-200");
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            
            document.getElementById('tab-' + t).className = "px-4 py-2 bg-emerald-800 text-white rounded-lg font-medium tab-btn";
            document.getElementById('form-' + t).classList.remove('hidden');
            renderData();
        }

        function handleInventorySubmit(e) {
            e.preventDefault();
            db.ref('inventory').push({
                name: document.getElementById('inv-name').value,
                buyPrice: document.getElementById('inv-buy').value,
                qty: document.getElementById('inv-qty').value
            });
            document.getElementById('invForm').reset();
        }

        function handleSaleSubmit(e) {
            e.preventDefault();
            db.ref('sales').push({
                customer: document.getElementById('sale-customer').value,
                total: document.getElementById('sale-total').value,
                method: document.getElementById('sale-method').value
            });
            document.getElementById('saleForm').reset();
        }

        function handlePatientSubmit(e) {
            e.preventDefault();
            db.ref('patients').push({
                name: document.getElementById('p-name').value,
                type: document.getElementById('p-type').value,
                symptoms: document.getElementById('p-symptoms').value
            });
            document.getElementById('patientForm').reset();
        }

        function deleteRecord(id) {
            if(confirm("Delete item?")) db.ref(activeTab + '/' + id).remove();
        }

        function renderData() {
            const title = document.getElementById('table-title');
            const headers = document.getElementById('table-headers');
            const tbody = document.getElementById('data-rows');
            
            db.ref(activeTab).on('value', snap => {
                tbody.innerHTML = '';
                const records = snap.val();
                if(!records) {
                    tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-400">No data stored inside this tab.</td></tr>';
                    return;
                }
                
                if(activeTab === 'inventory') {
                    title.innerText = "Live Inventory Items";
                    headers.innerHTML = '<tr><th class="p-3">Item Name</th><th class="p-3">Buy Price</th><th class="p-3">Qty</th><th class="p-3">Action</th></tr>';
                    Object.keys(records).forEach(k => {
                        tbody.innerHTML += `<tr class="border-b"><td class="p-3 font-medium">${records[k].name}</td><td class="p-3">Tk ${records[k].buyPrice}</td><td class="p-3">${records[k].qty} Pcs</td><td class="p-3"><button class="text-red-500" onclick="deleteRecord('${k}')"><i class="fa-solid fa-trash"></i></button></td></tr>`;
                    });
                } else if(activeTab === 'sales') {
                    title.innerText = "Live Store Invoices";
                    headers.innerHTML = '<tr><th class="p-3">Customer</th><th class="p-3">Bill Paid</th><th class="p-3">Method</th><th class="p-3">Action</th></tr>';
                    Object.keys(records).forEach(k => {
                        tbody.innerHTML += `<tr class="border-b"><td class="p-3 font-medium">${records[k].customer}</td><td class="p-3 text-emerald-700 font-bold">Tk ${records[k].total}</td><td class="p-3">${records[k].method}</td><td class="p-3"><button class="text-red-500" onclick="deleteRecord('${k}')"><i class="fa-solid fa-trash"></i></button></td></tr>`;
                    });
                } else if(activeTab === 'patients') {
                    title.innerText = "Live Active Patient Registry";
                    headers.innerHTML = '<tr><th class="p-3">Pet Name</th><th class="p-3">Type</th><th class="p-3">Symptoms</th><th class="p-3">Action</th></tr>';
                    Object.keys(records).forEach(k => {
                        tbody.innerHTML += `<tr class="border-b"><td class="p-3 font-medium">${records[k].name}</td><td class="p-3">${records[k].type}</td><td class="p-3 text-xs">${records[k].symptoms}</td><td class="p-3"><button class="text-red-500" onclick="deleteRecord('${k}')"><i class="fa-solid fa-trash"></i></button></td></tr>`;
                    });
                }
            });
        }
        renderData();
    </script>
</body>
</html>
